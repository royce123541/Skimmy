name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build and zip (Chrome + Edge)
        run: |
          npm run zip
          npm run zip:edge
          node scripts/assert-store-manifest.js .output/chrome-mv3/manifest.json .output/edge-mv3/manifest.json

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (test build with platform access pre-granted)
        run: npm run e2e

      - name: Upload extension packages
        uses: actions/upload-artifact@v4
        with:
          name: skimmy-extension
          path: .output/*.zip
          if-no-files-found: error

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
